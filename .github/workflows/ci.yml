# CI (security/06 §3). Rules: actions pinned to full commit SHAs (SEC-DEP-08), read-only token,
# never pull_request_target, no secrets in this workflow. Reviewed with the gha-security-review skill before enabling.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Repo supply-chain checks (SEC-DEP-02/03/04/10)
        run: npm run check:repo

      - name: Install (lockfile only; install scripts blocked by .npmrc)
        run: npm ci

      - name: Vulnerability gate (SEC-DEP-06)
        run: npm run audit

      - name: Lint (incl. security rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, schema and content tests
        run: npm test

      - name: Build static export + post-build checks
        run: npm run build

      - name: Secret scan, git history and build output (SEC-SEC-01/02)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
          ./gitleaks dir --redact --no-banner --exit-code 1 out

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (static analysis)
        run: semgrep scan --config p/ci --config p/typescript --config p/react --config p/nextjs --config p/secrets --error --metrics=off
